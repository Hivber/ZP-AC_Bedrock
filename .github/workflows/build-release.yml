name: Build ZP-AC release packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check --input-type=module < mcaddon/scripts/main.js

      - name: Check Python syntax
        run: python -m compileall -q plugins/endstone_zp_anticheat tools tests

      - name: Test local AI behavior engine
        run: python -m unittest discover -s tests -v

      - name: Validate manifests, pack dependency, protocols and versions
        run: |
          python - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path

          manifest = json.loads(Path("mcaddon/manifest.json").read_text(encoding="utf-8"))
          resource_manifest = json.loads(Path("resource_pack/manifest.json").read_text(encoding="utf-8"))
          script = Path("mcaddon/scripts/main.js").read_text(encoding="utf-8")
          plugin = Path("plugins/endstone_zp_anticheat/plugin.py").read_text(encoding="utf-8")
          ai_engine = Path("plugins/endstone_zp_anticheat/ai/engine.py").read_text(encoding="utf-8")
          policy = Path("plugins/endstone_zp_anticheat/policy.py").read_text(encoding="utf-8")
          credit = Path("plugins/endstone_zp_anticheat/credit.py").read_text(encoding="utf-8")
          movement = Path("plugins/endstone_zp_anticheat/movement.py").read_text(encoding="utf-8")
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          config = tomllib.loads(Path("plugins/endstone_zp_anticheat/config.toml").read_text(encoding="utf-8"))

          assert manifest["header"]["version"] == [2, 1, 9]
          assert manifest["modules"][0]["version"] == [2, 1, 9]
          assert manifest["header"]["min_engine_version"] == [1, 26, 60]
          assert project["project"]["version"] == "0.9.0"
          assert 'version = "0.9.0"' in plugin
          assert resource_manifest["header"]["version"] == [1, 0, 0]
          assert resource_manifest["header"]["min_engine_version"] == [1, 26, 60]
          assert resource_manifest["modules"][0]["type"] == "resources"
          languages = json.loads(Path("resource_pack/texts/languages.json").read_text(encoding="utf-8"))
          assert languages == ["zh_CN", "en_US"]
          zh = Path("resource_pack/texts/zh_CN.lang").read_text(encoding="utf-8")
          en = Path("resource_pack/texts/en_US.lang").read_text(encoding="utf-8")
          assert "pack.name=" in zh and "pack.description=" in zh
          assert "pack.name=" in en and "pack.description=" in en
          assert resource_manifest["header"]["name"] == "pack.name"
          assert resource_manifest["header"]["description"] == "pack.description"
          assert any(dep.get("uuid") == resource_manifest["header"]["uuid"] and dep.get("version") == resource_manifest["header"]["version"] for dep in manifest["dependencies"])
          for asset in ("pack_icon.png", "textures/ui/zp_ac_logo.png", "textures/ui/icon_shield.png", "textures/ui/icon_credit.png", "textures/ui/icon_report.png", "textures/ui/menu_panel.png"):
              assert Path("resource_pack", asset).is_file(), asset
          assert 'command: "zp_ac:ba"' in script
          assert "查看我的信用分" in script
          assert "举报其他玩家" in script
          assert 'dropdown("§l§f第 1 项：选择举报玩家", targetNames)' in script
          assert 'dropdown("§l§f第 2 项：选择举报类型", reportCategories)' in script
          assert 'textField("§l§f第 3 项：填写举报原因（可留空）"' in script
          for category in ("恶意破坏", "攻击玩家", "辱骂", "外挂", "透视", "其他"):
              assert category in script
          assert "category=category" in plugin
          assert "PlayerChatEvent" in plugin
          assert 'if category == "辱骂":' in plugin
          assert "def on_player_chat(" in plugin
          assert "event.is_cancelled = True" in plugin
          assert "MuteStore" in plugin
          assert "RecentChatStore" in plugin
          assert "insult_report_not_confirmed" in plugin
          assert "test_history_expires_after_window" in Path("tests/test_chat_moderation.py").read_text(encoding="utf-8")
          assert "plugins/endstone_zp_anticheat/chat_moderation.py" in Path("tools/build_release.py").read_text(encoding="utf-8")
          assert "insult_mute_durations_seconds" in config
          assert config["insult_chat_window_seconds"] == 600
          assert config["insult_chat_max_messages_per_player"] == 50
          assert "insult_detection_terms" in config
          assert "def duration_for_violation(" in Path("plugins/endstone_zp_anticheat/mute.py").read_text(encoding="utf-8")
          assert "test_first_report_mutes_immediately_and_increases_on_repeats" in Path("tests/test_mute.py").read_text(encoding="utf-8")
          assert "function openBaMenu(player)" in script
          assert "[REPORT_UI_CONFIG.command]: (player) => openBaMenu(player)" in script
          assert 'const ADMIN_UI_COMMAND = "zp_ac:admin"' in script
          assert "playerreport:ba" not in script
          assert "zp:ac_admin_request" in script and "zp:ac_admin_response" in script
          assert "zp:ac_admin_request" in plugin and "zp:ac_admin_response" in plugin
          assert config["behavior_pack_bridge_enabled"] is True
          checks = config["anti_cheat_checks"]
          assert set(checks) == {"speed", "flight", "reach", "combat", "autoclick", "scaffold", "fast_break", "xray"}
          assert all(value is True for value in checks.values())
          assert "反作弊检测功能开关" in script
          assert "矿物透视 / 异常定向采矿检测" in script
          assert "xray_mining_pattern" in plugin
          assert "LocalBehaviorAI" in plugin
          assert "OnnxBehaviorModel" in plugin
          assert "BehaviorDatasetCollector" in plugin
          assert "def snapshot(" in ai_engine
          assert "ai_dataset_enabled" in Path("plugins/endstone_zp_anticheat/config.toml").read_text(encoding="utf-8")
          assert "FEATURE_ORDER" in Path("plugins/endstone_zp_anticheat/ai/onnx_engine.py").read_text(encoding="utf-8")
          assert "has_independent_strong_evidence" in plugin
          assert '"speed": ("speed_sustained", False)' in plugin
          assert "def on_player_respawn(" in plugin
          assert "PlayerRespawnEvent" in plugin
          assert config["spawn_grace_seconds"] == 5.0
          assert "world.afterEvents.playerSpawn.subscribe" in script
          assert "SPAWN_GRACE_TICKS" in script
          assert "auto_kick_min_strong_rules" in config
          assert "def has_independent_strong_evidence" in policy
          assert "can_damage_players" in credit
          assert "accrue_public_credit" in credit
          assert "is_retaliation_allowed" in credit
          assert "should_count_pvp_hit" in credit
          assert 'command.name == "zp"' in plugin
          assert "public_credit_lock_threshold" in plugin
          assert "repeated_one_sided_pvp" in plugin
          assert config["public_credit_initial_score"] == 100.0
          assert config["public_credit_lock_threshold"] == 70.0
          assert 'if action == "credit":' in plugin
          assert 'send_action_bar("§c信用分过低")' in plugin
          assert "public_credit_recovery_seconds" in plugin
          assert "Time spent offline" in plugin
          assert "public_credit_retaliation_seconds" in config
          assert "test_recovery_progress_survives_restart" in Path("tests/test_public_credit.py").read_text(encoding="utf-8")
          assert "test_retaliation_only_applies_to_same_attacker_within_five_seconds" in Path("tests/test_public_credit.py").read_text(encoding="utf-8")
          assert "test_retaliation_does_not_count_as_harassment_or_deduct_credit" in Path("tests/test_public_credit.py").read_text(encoding="utf-8")
          assert "test_player_command_exposes_only_public_credit" in Path("tests/test_public_credit.py").read_text(encoding="utf-8")
          assert "test_admin_query_is_guarded" in Path("tests/test_public_credit.py").read_text(encoding="utf-8")
          assert "def analyze(" in ai_engine
          assert "def read_effect_amplifier(" in movement
          assert "def speed_effect_multiplier(" in movement
          assert "read_effect_amplifier" in plugin
          assert "speed_effect_multiplier" in plugin
          assert "EvidenceStore" in plugin
          assert "RuntimeMetrics" in plugin
          assert "summarize_mining_events" in plugin
          assert "PacketSendEvent" in plugin
          assert "outgoing_level_chunk_packets" in plugin
          assert "outgoing_subchunk_packets" in plugin
          assert "security_max_bridge_payload_bytes" in plugin
          assert "def review(" in Path("plugins/endstone_zp_anticheat/evidence_store.py").read_text(encoding="utf-8")
          assert "def snapshot(" in Path("plugins/endstone_zp_anticheat/runtime_metrics.py").read_text(encoding="utf-8")
          assert "test_append_recent_and_review_are_persistent" in Path("tests/test_security_modules.py").read_text(encoding="utf-8")
          assert "ai_api_enabled = false" in Path("plugins/endstone_zp_anticheat/config.toml").read_text(encoding="utf-8")
          assert config["anti_cheat_checks"]["xray"] is True
          assert '.toggle(rows[0][1], { defaultValue: isCheckEnabled("speed") })' in script
          assert not re.search(r"\.toggle\(rows\[\d+\]\[1\], isCheckEnabled", script)
          assert 'action == "set_checks"' in plugin
          assert "zp:ac_checks_sync" in script and "zp:ac_checks_sync" in plugin
          print("ZP-AC manifests, resource-pack dependency, protocol and detection-toggle checks passed.")
          PY

      - name: Install wheel builder
        run: python -m pip install --upgrade build

      - name: Build and validate the single addon and plugin wheel
        run: python tools/build_release.py

      - name: Verify release outputs
        run: |
          test "$(find dist -maxdepth 1 -name '*.mcaddon' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          ls -lh dist/

      - name: Upload ZP-AC packages
        uses: actions/upload-artifact@v5
        with:
          name: ZP-AC-2.1.9-and-Endstone-0.8.0
          path: |
            dist/*.mcaddon
            dist/*.whl
          if-no-files-found: error
          retention-days: 90
